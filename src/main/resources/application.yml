quarkus:
  application:
    name: testecvc-broker
  smallrye-openapi:
    path: /q/openapi
  http:
    port: 8081
  datasource:
    devservices:
      image-name: postgres:16-alpine
  hibernate-orm:
    schema-management:
      strategy: none
  flyway:
    migrate-at-start: true

# O contrato estatico (openapi/broker-v1.yaml) e a fonte; nada e gerado por anotacao.
mp:
  openapi:
    scan:
      disable: true

broker:
  # Chaves de desenvolvimento (MB2 move para o banco, com hash).
  api-keys:
    read:
      key: ${BROKER_READ_KEY:read-key-dev}
    admin:
      key: ${BROKER_ADMIN_KEY:admin-key-dev}
  rates:
    # A partir daqui o comprador deve considerar o dado vencido.
    freshness-minutes: 15
    max-nights: 30
