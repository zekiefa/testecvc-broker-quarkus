quarkus:
  application:
    name: testecvc-broker
  smallrye-openapi:
    path: /q/openapi
  http:
    port: 8081
  datasource:
    devservices:
      image-name: postgres:16-alpine
  hibernate-orm:
    schema-management:
      strategy: none
  flyway:
    migrate-at-start: true

# O contrato estatico (openapi/broker-v1.yaml) e a fonte; nada e gerado por anotacao.
mp:
  openapi:
    scan:
      disable: true

broker:
  # As chaves vivem em api_client (hash SHA-256), semeadas em V4 para desenvolvimento.
  rates:
    # A partir daqui o comprador deve considerar o dado vencido.
    freshness-minutes: ${BROKER_FRESHNESS_MINUTES:15}
    # Período máximo de uma cotação, em noites. Fonte única: cotação e busca leem daqui.
    max-nights: ${BROKER_MAX_NIGHTS:30}
